spring.application.name=GuardianAI

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guardian_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

guardianai.ai.provider=${AI_PROVIDER:local}
guardianai.ai.remote.api-key=${AI_API_KEY:}
guardianai.ai.remote.model=${AI_MODEL:gpt-4o-mini}
guardianai.ai.remote.endpoint=${AI_ENDPOINT:https://api.example.com/v1/chat/completions}

server.error.include-message=always
