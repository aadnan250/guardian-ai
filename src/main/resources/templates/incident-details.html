<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Details | GuardianAI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/dashboard}">GuardianAI</a>
    <nav>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/logs/upload}">Upload Logs</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="page">
    <section class="page-header">
        <div>
            <p class="eyebrow">Incident details</p>
            <h1 th:text="${incident.threatType}">Threat Type</h1>
        </div>
        <a class="primary-link" th:href="@{/api/reports/{id}(id=${incident.id})}">Download Report</a>
    </section>

    <section class="detail-grid">
        <article class="metric"><span>Severity</span><strong th:text="${incident.severity}">High</strong></article>
        <article class="metric"><span>Confidence</span><strong th:text="${incident.confidenceScore + '%'}">90%</strong></article>
        <article class="metric"><span>IP Address</span><strong th:text="${incident.ipAddress}">192.168.1.50</strong></article>
        <article class="metric"><span>Username</span><strong th:text="${incident.username}">admin</strong></article>
    </section>

    <section class="panel wide">
        <h2>AI Analysis</h2>
        <pre class="analysis" th:text="${incident.aiExplanation}">Analysis</pre>
    </section>
</main>
</body>
</html>
