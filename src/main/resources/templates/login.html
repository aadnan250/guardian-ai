<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GuardianAI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel">
        <p class="eyebrow">GuardianAI</p>
        <h1>Sign in</h1>
        <p class="muted">Access the SOC dashboard and analyze defensive security logs.</p>

        <div class="alert success" th:if="${param.registered}">Account created. Sign in to continue.</div>
        <div class="alert" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert success" th:if="${param.logout}">You have been signed out.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Login</button>
        </form>
        <p class="switch-link">New here? <a th:href="@{/register}">Create an account</a></p>
    </section>
</main>
</body>
</html>
