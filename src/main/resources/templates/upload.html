<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Logs | GuardianAI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/dashboard}">GuardianAI</a>
    <nav>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/logs/upload}">Upload Logs</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="page narrow">
    <section class="page-header">
        <div>
            <p class="eyebrow">Log analysis</p>
            <h1>Upload security logs</h1>
        </div>
    </section>

    <section class="panel">
        <div class="alert success" th:if="${message}" th:text="${message}"></div>
        <form th:action="@{/logs/upload}" method="post" enctype="multipart/form-data" class="upload-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="file">Log file</label>
            <input id="file" name="file" type="file" accept=".txt,.log" required>
            <button type="submit">Analyze Logs</button>
        </form>
    </section>
</main>
</body>
</html>
