services:
  postgres:
    image: postgres:16
    container_name: guardian-ai-postgres
    environment:
      POSTGRES_DB: guardian_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - guardian-ai-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: guardian-ai-app
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/guardian_ai
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DRIVER: org.postgresql.Driver
      AI_PROVIDER: local
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-https://api.example.com/v1/chat/completions}
    ports:
      - "8080:8080"

volumes:
  guardian-ai-data:
